<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="weather_model">
        <h1 class="weather_title">Weather</h1>

        <form id="weatherForm" class="weather_form">
            <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off" required>
            <button type="submit" id="searchBtn" class="form_button">Search</button>
        </form>

        <div class="weather_info">
            <h2 class="info_title">--</h2>
            <p class="temp">--</p>
            <p class="description">--</p>
        </div>

        <div class="extra_info">
            <div class="wet">
                <h4 class="wet_text">Humidity</h4>
                <p class="wet_perc">--</p>
            </div>

            <div class="wind">
                <h4 class="wind_text">Wind</h4>
                <p class="wind_perc">--</p>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
